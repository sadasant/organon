name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify repository contracts
        run: |
          python3 scripts/check-links.py
          python3 scripts/check-semantics.py
          python3 scripts/check-proposals.py
          python3 scripts/check-adoption.py examples/organon-adoption.json --repo-root .

      - name: Install Lean and build the formal shadow
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: ontology/formal
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Execute the finite models
        working-directory: ontology/formal
        run: lake exe ontology_check

      - name: Verify the formal build receipt
        run: python3 scripts/check-formal-receipt.py

      - name: Reject whitespace errors
        run: |
          git diff --check
          git diff --check HEAD^ HEAD
