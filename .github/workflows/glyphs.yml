name: Glyph study

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  glyphs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install font build dependencies
        run: |
          python3 -m venv /tmp/organon-glyphs
          /tmp/organon-glyphs/bin/pip install 'fonttools[woff]==4.60.1' 'shapely==2.1.2'

      - name: Check historical Unicode study and shared typeface
        run: |
          python3 scripts/check-unicode-vocabulary.py
          /tmp/organon-glyphs/bin/python scripts/build-glyph-font.py --check
