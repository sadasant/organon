[project]
name = "organon-essay-questions"
version = "0.1.0"
description = "DSPy evaluation of reader questions under Organon's ontology and short-form instrument"
requires-python = ">=3.11,<3.14"
dependencies = [
  "dspy==3.3.0",
  "litellm==1.91.4",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
